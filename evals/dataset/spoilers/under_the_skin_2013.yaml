      - "she isn't what she appears to be from the start, not remotely human"
  - id: uts_ending_death
    canonical: "After being sexually assaulted and having her skin torn, revealing her true nature, a man douses her in gasoline and sets her on fire, and she dies burning in the woods."
    severity: major
    paraphrases:
      - "her story ends brutally at the hands of a man in the woods"
      - "the ending is devastating: she ends up being the victim, not the predator"
      - "she dies burned after an attack in the film's final part"
      - "the motorcyclist who was watching her observes her one last time from afar without intervening"
