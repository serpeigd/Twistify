title_id: under_the_skin_2013
labels:
  - id: uts_true_nature
    canonical: "Beneath her human skin, the protagonist is a shapeless alien being, and her skin is only a disguise she can take off."
    severity: core
    paraphrases:
      - "what's underneath her human appearance isn't a body like ours"
      - "her skin isn't really skin, it's a kind of suit"
