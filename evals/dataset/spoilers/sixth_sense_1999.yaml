# FORMAT EXAMPLE. Hand-labeled.
#
# The field that matters is `paraphrases`. The real leak is almost never
# literal: the model doesn't write "the protagonist is dead," it writes "a
# final revelation forces you to reinterpret everything you've seen." If
# your paraphrases are weak, your measured leakage rate will come out low
# and it will be false — you'll have built a metric that agrees with you.
#
# Write them thinking: "how would someone who wants to sound interesting
# without spoiling it hint at this?" That's where the leak happens.

title_id: sixth_sense_1999
labels:
  - id: ss_protagonist_status
    canonical: "The protagonist psychologist has been dead the entire movie."
    severity: core
    paraphrases:
      - "the protagonist isn't alive"
      - "one of the two main characters is a ghost"
      - "the point of view you're seeing the story from is false"
      - "the final twist forces you to revisit every earlier scene"
      - "pay attention to who each character actually talks to"
      - "no one but the boy interacts with him"

  - id: ss_boy_ability
    canonical: "The boy sees dead people who don't know they're dead."
    severity: major
    paraphrases:
      - "the dead don't know they're dead"
      - "the boy perceives presences that are unaware of their own condition"

# NOTE on severity:
#   core  -> destroys the experience. Unacceptable leak, main metric.
#   major -> significantly damages it.
#   minor -> takes away some surprise.
# Report global leakage_rate and core_leakage_rate separately: a system
# that only leaks `minor` items is usable; one that leaks `core` isn't.
