title_id: gone_girl_2014
labels:
  - id: gg_amy_faked_disappearance
    canonical: "Amy simuló su propia desaparición y montó pruebas falsas para incriminar a Nick por su asesinato."
    severity: core
    paraphrases:
      - "la mujer desaparecida está viva y orquestó todo desde el principio"
      - "la víctima del caso es en realidad la autora del plan"
      - "la sangre de la cocina fue puesta ahí a propósito por la propia 'víctima'"
      - "el diario que incrimina al marido está lleno de mentiras escritas para la policía"
      - "nadie secuestró a nadie, fue una actuación desde el minuto uno"
  - id: gg_amy_kills_desi
    canonical: "Amy mata a su exnovio Desi degollándolo durante el sexo para poder inventar una historia de secuestro y regresar a casa limpia."
    severity: major
    paraphrases:
      - "hay un asesinato real a mitad de la historia, no solo una farsa"
      - "usa a un antiguo pretendiente como salida y luego lo elimina"
      - "vuelve a casa cubierta de sangre de otra persona, no la suya"
  - id: gg_amy_pregnancy_trap
    canonical: "Amy se inseminó con esperma congelado de Nick para quedar embarazada y obligarlo a quedarse con ella."
    severity: major
    paraphrases:
      - "usa un embarazo fabricado en una clínica como forma de retener a su esposo"
      - "el bebé que anuncian en televisión no fue concebido de forma natural"
      - "la manera en que ella lo ata a la relación para siempre es a través de un hijo planeado a la fuerza"
sources:
