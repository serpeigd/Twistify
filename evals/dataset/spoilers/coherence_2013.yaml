# Ground truth researched by Claude with cited web sources (not hand-labeled
# by a human). See D7 in docs/DESIGN.md.
title_id: coherence_2013
labels:
  - id: coh_multiple_realities_converge
    canonical: "A passing comet causes multiple parallel realities with duplicate versions of the same eight friends to cross paths that night."
    severity: core
    paraphrases:
      - "the dinner guests start running into copies of themselves"
      - "there's more than one version of each character wandering the neighborhood that night"
      - "there's an identical house full of identical people around the corner"
      - "the astronomical event breaks more than just the house's lights"
      - "each group has a box of numbered photos of 'the others'"
  - id: coh_emily_swaps_herself
    canonical: "Emily drugs an alternate version of herself, locks her up, and takes her place in a reality that seems better than her own."
    severity: core
    paraphrases:
      - "the protagonist decides to steal another version of herself's life"
      - "at the end she doesn't return to 'her own' reality, but a different one"
      - "they sedate and lock up one of the Emilys so the other can take her spot"
      - "the one who ends the night on the couch isn't exactly the Emily the film started with"
  - id: coh_ending_infinite_loop
    canonical: "The final phone call from another 'Emily' suggests the cycle of duplicate realities never closes, and that she's trapped forever in a life that isn't fully hers."
    severity: major
    paraphrases:
      - "the ending makes clear this doesn't end with a single version winning"
      - "the phone ringing at the end is a clue that more copies are still loose"
      - "she can never be sure she chose the right reality"
      - "the ambiguous close implies the problem is still unresolved"
sources:
  - "https://en.wikipedia.org/wiki/Coherence_(film)"
  - "https://www.looper.com/899500/the-ending-of-coherence-explained/"
  - "https://www.highonfilms.com/coherence-2013-movie-ending-title-explained-themes-analysed/"
