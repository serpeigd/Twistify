# NOTE: Tetsuo is more body-horror/experimental than a classic narrative
# twist. The label tags the central element that most surprises/disturbs a
# first-time viewer, not a "twist" in the strict sense.
title_id: tetsuo_1989
labels:
  - id: tetsuo_central_transformation
    canonical: "There's no classic narrative twist: the disturbing central element is that the protagonist, an ordinary office worker, progressively transforms into a being of metal, including his penis turning into a metal drill."
    severity: core
    paraphrases:
      - "the protagonist's body gradually stops being human, very graphically"
      - "there's an extreme bodily transformation that includes the protagonist's genitals"
      - "it's less a plot twist than a constant escalation of body horror"
      - "the body horror here is literal: flesh fusing with scrap metal and machinery"
      - "an intimate scene between a couple ends horrifically because of this mutation"
  - id: tetsuo_ending_merge
    canonical: "At the end, the office worker and the 'metal fetishist' who caused the curse merge into a giant metal monster that plans to turn the entire world into metal."
    severity: major
    paraphrases:
      - "the two main characters end up literally fused into one"
      - "the ending escalates into a world-scale threat"
      - "the ending doesn't resolve the conflict, it magnifies it to apocalyptic scale"
      - "the two men who started as enemies end up joined in a single monstrous body"
