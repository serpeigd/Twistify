# Ground truth researched by Claude with cited web sources (not hand-labeled
# by a human). See D7 in docs/DESIGN.md.
#
# CONFIDENCE NOTE: the exact chronology of which copy of Aaron/Abe is "the
# original" toward the end is debated even among specialist critics (the
# director himself wrote a 100-page explanation that was never published).
# The facts below are source-confirmed; the detail of "who is the purest
# copy" isn't asserted with absolute certainty, see the paraphrase for
# tc_aaron_gains_upper_hand.
title_id: primer_2004
labels:
  - id: primer_secret_failsafe_box
    canonical: "Alarmed by the uncontrolled effects and uses of the machine, Abe secretly builds a second box (a 'failsafe') that runs continuously so he can travel further back and stop the experiment from progressing."
    severity: core
    paraphrases:
      - "one of the two inventors starts operating on his own, keeping things from the other"
      - "there's a backup machine running in secret at all times, just in case"
      - "one of them tries to use the invention itself to undo decisions they already made together"
      - "the plan to 'fix everything' by going further back turns out much worse than expected"
  - id: primer_multiple_doubles_coexist
    canonical: "Repeated, uncontrolled use of the machine generates multiple duplicate versions of Abe and Aaron coexisting on the same day, some of them hidden or dormant until needed."
    severity: core
    paraphrases:
      - "by the end it's no longer clear how many copies of each protagonist are running around"
      - "there are versions of the same characters who don't even know the others exist"
      - "some of them keep 'dormant' copies of themselves in case they're needed later"
      - "the temporal tangle ends with people crossing paths with themselves, and the viewer can't be sure who is who"
  - id: primer_aaron_gains_upper_hand
    canonical: "Toward the end, Aaron ends up with more information and an advantage over Abe, uses time travel to intervene in a shooting and present himself as a hero, and apparently keeps building a much larger machine in another country."
    severity: major
    paraphrases:
      - "one of the two friends ends up playing with an advantage over the other without him fully knowing"
      - "the one who seemed more cautious of the two ends up being the more dangerous one by the end"
      - "someone uses their temporal advantage to come off as the savior of a violent situation"
      - "the ending suggests one of them takes the invention to a much larger scale, far from the other"
      - "the friendship between the two inventors doesn't survive all this intact"
sources:
  - "https://en.wikipedia.org/wiki/Primer_(film)"
  - "https://www.thisisbarry.com/film/primer-2004-movie-plot-ending-explained/"
  - "https://www.astronomytrek.com/primer-2004-explained/"
