title_id: spoorloos_1988
labels:
  - id: sp_raymond_motive
    canonical: "The kidnapper Raymond is a methodical sociopath who planned the crime for years as a personal experiment to prove to himself he was capable of absolute evil."
    severity: major
    paraphrases:
      - "the villain doesn't act on impulse, but out of a kind of twisted moral philosophy"
      - "he wants to prove something to himself about his own capacity for evil"
      - "there's a long scene where the kidnapper calmly explains why he did it"
      - "his logic is that you can only be truly good if you're capable of the worst"
  - id: sp_ending_buried_alive
    canonical: "Rex agrees to drink drugged coffee to learn what happened to Saskia, and ends up waking up buried alive in a coffin, the same fate she suffered three years earlier."
    severity: core
    paraphrases:
      - "the protagonist decides to find out the truth at the highest possible price, literally"
      - "the ending happens underground, in complete darkness, with a lighter as the only light"
      - "to learn the truth, he has to live through exactly what the victim went through"
      - "there's no rescue, no happy ending, just the same trap repeated"
      - "the ending is as simple as it is terrible: they share the same grave"
