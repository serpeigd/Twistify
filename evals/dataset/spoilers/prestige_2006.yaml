# Ground truth researched by Claude with cited web sources (not hand-labeled
# by a human). See D7 in docs/DESIGN.md.
title_id: prestige_2006
labels:
  - id: prestige_borden_twins
    canonical: "Alfred Borden is actually two identical twin brothers who take turns living as a single person."
    severity: core
    paraphrases:
      - "the protagonist magician was never a single person"
      - "there are two men sharing an identity, a name, and even a marriage"
      - "the 'Transported Man' trick wasn't a trick, it was literal"
      - "one of the two loved one woman, the other loved another, and no one knew"
      - "the one who dies by execution isn't necessarily the one who survives at the end"
  - id: prestige_teslamachine_clones
    canonical: "Tesla's machine doesn't teleport Angier — it creates an exact clone every time it's used, while the original falls through a trapdoor and drowns."
    severity: core
    paraphrases:
      - "every show performance involves a real death no one suspects"
      - "the device doesn't move the person elsewhere, it duplicates them"
      - "there's a hidden water tank under the stage full of versions of the same man"
      - "the price of that final trick is dying every single night"
      - "what Tesla built didn't do what Angier thought it did"
  - id: prestige_angier_killed_by_borden
    canonical: "At the end, the surviving Borden shoots and kills Angier, avenging his executed brother."
    severity: major
    paraphrases:
      - "the rivalry ends with one of the two magicians dead at the other's hands"
      - "the ending is literally a reckoning settled with a gun"
      - "Borden's daughter ends up in the custody of the twin who survived"
sources:
  - "https://en.wikipedia.org/wiki/The_Prestige_(film)"
