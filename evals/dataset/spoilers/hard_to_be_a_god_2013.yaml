# Ground truth researched by Claude with cited web sources (not hand-labeled
# by a human). See D7 in docs/DESIGN.md.
title_id: hard_to_be_a_god_2013
labels:
  - id: htbg_budakh_impostor
    canonical: "The wise man Budakh whom Rumata rescues first turns out to be a useless impostor; the real Budakh remains a prisoner in Don Reba's castle."
    severity: major
    paraphrases:
      - "the intellectual the protagonist thinks he's saved isn't who he claims to be"
      - "there's a substitution: the real sage was held captive the whole time"
      - "the initial rescue turns out to be pointless because they rescued the wrong person"
      - "the character meant to represent the planet's intellectual hope is actually a pathetic impostor"
  - id: htbg_rumata_breaks_neutrality
    canonical: "After his fiancée Ari is murdered by Don Reba's forces, Rumata breaks his non-interference directive and unleashes a violent massacre against his enemies."
    severity: core
    paraphrases:
      - "the protagonist ends up betraying his mission's central rule: don't get involved"
      - "the death of a loved one turns the peaceful 'god' into a brutal avenger"
      - "the ending is a spiral of violence unleashed by the protagonist himself, not the villains"
      - "the scientific observer who was supposed to stay neutral ends up actively taking part in the massacre"
      - "there's an emotional breaking point that leads him to fully abandon his role as a detached scientist"
  - id: htbg_rumata_stays_behind
    canonical: "At the end, Rumata turns down rescue from another Earth scientist and stays on the planet, saying 'it's hard to be a god,' instead of returning to Earth."
    severity: minor
    paraphrases:
      - "the protagonist gets the chance to go home and decides not to take it"
      - "he ends up staying, by his own choice, trapped in the world he was only meant to observe"
      - "the film's title becomes almost literally its final line"
      - "there's no triumphant return to Earth, the story closes with him isolated"
sources:
  - "https://en.wikipedia.org/wiki/Hard_to_Be_a_God_(2013_film)"
  - "https://www.filminquiry.com/hard-to-be-a-god-2013-review/"
