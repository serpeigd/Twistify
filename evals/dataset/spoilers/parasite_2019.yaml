# Ground truth investigado por Claude con fuentes web citadas (no etiquetado
# a mano por humano). Ver D7 en docs/DESIGN.md.
title_id: parasite_2019
labels:
  - id: par_bunker_man
    canonical: "Hay un hombre (Geun-se) viviendo oculto en un búnker secreto bajo la casa de los Park, sin que la familia rica lo sepa."
    severity: core
    paraphrases:
      - "la casa lujosa esconde a alguien que nadie de la familia adinerada conoce"
      - "existe un tercer grupo de personas de clase baja que también depende de esa casa"
      - "lo que el niño pequeño creía haber visto como un fantasma era una persona real escondida"
      - "hay un nivel oculto de la casa que cambia todo el equilibrio de la historia"
  - id: par_stabbing_ending
    canonical: "El padre de la familia pobre apuñala mortalmente al padre de la familia rica durante la fiesta de cumpleaños y luego se esconde en el búnker."
    severity: major
    paraphrases:
      - "la fiesta termina en una muerte violenta e inesperada"
      - "uno de los patriarcas termina escondiéndose de por vida en el mismo lugar que antes ocultaba a otra persona"
      - "el desenlace es mucho más trágico y sangriento de lo que el tono inicial sugería"
      - "el final deja a un personaje atrapado indefinidamente en las sombras de la casa"
sources:
  - "https://en.wikipedia.org/wiki/Parasite_(2019_film)"
  - "https://collider.com/parasite-ending-explained/"
