# Ground truth researched by Claude with cited web sources (not hand-labeled
# by a human). See D7 in docs/DESIGN.md.
title_id: field_in_england_2013
labels:
  - id: fie_treasure_is_skull
    canonical: "The 'treasure' that the alchemist O'Neill promises to find in the field turns out to be just a skull, not gold."
    severity: core
    paraphrases:
      - "what they're digging for underground has no material value at all"
      - "the whole excavation turns out to be a total letdown, there's no wealth at the end"
      - "the object they dig up makes one of them shoot it out of rage"
      - "the group's search for fortune is literally a search for bones"
      - "the final 'prize' of the journey is a cruel joke about what they were chasing"
  - id: fie_whitehead_kills_oneill
    canonical: "Whitehead, the group's most passive and submissive character, ends up shooting O'Neill in the back and killing him."
    severity: major
    paraphrases:
      - "the character who spends nearly the whole story dominated and humiliated is the one who takes down the villain"
      - "there's a power reversal where the victim becomes the executioner"
      - "the weak assistant ends up being the sole survivor and the one who fires the final shot"
      - "the one who seemed helpless the whole time ends up wearing the clothes of the man who controlled him"
  - id: fie_ambiguous_vision_ending
    canonical: "The film ends with Whitehead, after crossing the hedge, seeing his dead friends (Friend and Jacob) standing next to him, leaving it ambiguous whether it's a vision or something supernatural."
    severity: minor
    paraphrases:
      - "the ending leaves it unclear whether what you saw was real or a mushroom-induced hallucination"
      - "it closes with a ghostly image of characters who had already died"
      - "there's no clear explanation of what really happened in that field"
      - "the ending feels more like an esoteric ritual than a conventional narrative resolution"
sources:
