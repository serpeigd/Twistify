# Ground truth researched by Claude with cited web sources (not hand-labeled
# by a human). See D7 in docs/DESIGN.md.
title_id: dune_2021
labels:
  - id: dune_leto_betrayal_death
    canonical: "Doctor Yueh betrays House Atreides by deactivating the shields, allowing Baron Harkonnen to kill Duke Leto."
    severity: core
    paraphrases:
      - "Paul's father doesn't make it to the end of the film alive"
      - "there's a traitor embedded in the Atreides' inner circle"
      - "someone with the highest medical trust is the one who opens the door to the enemy"
      - "the duke falls into the Baron's trap because of one of his own"
      - "the leader of the protagonist family doesn't survive the attack on Arrakis"
  - id: dune_paul_kwisatz_haderach
    canonical: "Paul is the product of a Bene Gesserit selective breeding program to create the Kwisatz Haderach, a messianic figure."
    severity: major
    paraphrases:
      - "the young protagonist was genetically 'designed' by an order of powerful women"
      - "his mother disobeyed orders by having him instead of a daughter"
      - "there's an entire religious conspiracy behind the hero's birth"
      - "Paul might be the special being they've been secretly waiting for centuries"
  - id: dune_fremen_prophecy_manufactured
    canonical: "The Fremen's reverence for Paul stems from religious propaganda (Missionaria Protectiva) planted centuries earlier by the Bene Gesserit, not a real prophecy."
    severity: major
    paraphrases:
      - "the 'prophecy' everyone reveres was fabricated in advance by political manipulators"
      - "the desert natives believe in a myth that was actually planted artificially"
      - "the messianism surrounding the protagonist has a much less mystical origin than it seems"
      - "there's an organization that seeded legends on several planets in case they'd ever be useful"
  - id: dune_part_one_open_ending
    canonical: "The film ends without final resolution: Paul joins the Fremen after defeating Jamis in combat, and the story stays open ('this is only the beginning')."
    severity: minor
    paraphrases:
      - "don't expect the plot to close, it's only the first half of the story"
      - "the movie ends right as the protagonist starts integrating with the desert people"
      - "the ending leaves the big conflict for a sequel"
      - "it ends with a line that makes clear the important part hasn't happened yet"
sources:
  - "https://en.wikipedia.org/wiki/Dune_(2021_film)"
  - "https://flickside.com/dune-2021-explained/"
