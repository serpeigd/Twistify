title_id: oldboy_2003
labels:
  - id: ob_midoo_is_daughter
    canonical: "Mi-do, the woman Dae-su falls in love with after his release, is actually his own daughter."
    severity: core
    paraphrases:
      - "the protagonist's romantic relationship is actually a blood tie"
      - "he discovers in a photo album that the girl he's with isn't who he thought"
      - "the hero's final love interest turns out to be from his own family"
      - "the whole romance of the second half of the film hides a genealogical horror"
  - id: ob_hypnosis_engineered_relationship
    canonical: "Woo-jin hypnotized and manipulated Dae-su and Mi-do into falling in love without knowing they were related, as the ultimate revenge."
    severity: core
    paraphrases:
      - "the villain didn't just lock him up, he also designed his love life after release"
      - "the reunion that looks like coincidence was orchestrated with hypnosis"
      - "the revenge doesn't end with the release, it keeps manipulating what happens afterward"
  - id: ob_incest_rumor_origin
    canonical: "Dae-su unknowingly started the rumors that led to the suicide of Woo-jin's sister, having seen and gossiped about her incestuous relationship with him in high school."
    severity: major
    paraphrases:
      - "the reason for the imprisonment traces back to high school gossip the protagonist spread without meaning harm"
      - "the reason for the entire revenge plot is a death Dae-su himself caused unknowingly decades earlier"
      - "what he saw as a teenager and mentioned to a friend triggered a tragedy he never imagined"
  - id: ob_tongue_cut
    canonical: "Upon discovering the truth, Dae-su cuts out his own tongue as an act of penance and supplication."
    severity: minor
    paraphrases:
      - "the protagonist brutally mutilates himself upon learning the truth"
      - "there's a final scene where he physically punishes himself, begging forgiveness"
