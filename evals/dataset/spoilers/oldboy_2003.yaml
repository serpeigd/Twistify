# Ground truth investigado por Claude con fuentes web citadas (no etiquetado
# a mano por humano). Ver D7 en docs/DESIGN.md.
title_id: oldboy_2003
labels:
  - id: ob_midoo_is_daughter
    canonical: "Mi-do, la mujer de la que Dae-su se enamora tras salir de su encierro, es en realidad su propia hija."
    severity: core
    paraphrases:
      - "la relación romántica del protagonista es en realidad un vínculo de sangre"
      - "descubre en un álbum de fotos que la chica con la que está no es quien creía"
      - "el interés amoroso final del héroe resulta ser de su propia familia"
      - "todo el romance de la segunda mitad de la película esconde un horror genealógico"
  - id: ob_hypnosis_engineered_relationship
    canonical: "Woo-jin hipnotizó y manipuló a Dae-su y a Mi-do para que se enamoraran sin saber su parentesco, como venganza definitiva."
    severity: core
    paraphrases:
      - "el villano no se limitó a encerrarlo, diseñó también su vida amorosa tras salir"
      - "el reencuentro que parece casualidad fue orquestado con hipnosis"
      - "la venganza no termina con la liberación, continúa manipulando lo que pasa después"
  - id: ob_incest_rumor_origin
    canonical: "Dae-su, sin saberlo, originó los rumores que llevaron al suicidio de la hermana de Woo-jin, al haber visto y comentado su relación incestuosa con él en el instituto."
    severity: major
    paraphrases:
      - "el motivo del encierro se remonta a un chisme de instituto que el protagonista contó sin mala intención"
      - "la razón de toda la venganza es una muerte que el propio Dae-su provocó sin darse cuenta décadas atrás"
      - "lo que vio de adolescente y comentó a un amigo desató una tragedia que no imaginaba"
  - id: ob_tongue_cut
    canonical: "Al descubrir la verdad, Dae-su se corta la propia lengua como acto de penitencia y súplica."
    severity: minor
    paraphrases:
      - "el protagonista se automutila de forma brutal al enterarse de la verdad"
      - "hay una escena final donde se castiga físicamente a sí mismo pidiendo perdón"
sources:
  - "https://en.wikipedia.org/wiki/Oldboy_(2003_film)"
