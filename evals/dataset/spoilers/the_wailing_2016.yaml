# Ground truth researched by Claude with cited web sources (not hand-labeled
# by a human). See D7 in docs/DESIGN.md.
title_id: the_wailing_2016
labels:
  - id: wailing_stranger_is_demon
    canonical: "The Japanese stranger who arrives in the village is actually a demon who possesses and corrupts the villagers to sow chaos."
    severity: core
    paraphrases:
      - "the stranger everyone suspects from the start turns out to be exactly what they feared"
      - "the supernatural threat isn't a metaphor, it's literally demonic"
      - "the silent stranger from the woods is the real source of all the evil"
      - "what looked like the village's xenophobia toward the outsider ends up having a real basis"
  - id: wailing_shaman_betrayal
    canonical: "The shaman Il-gwang, hired to save the girl, is actually in league with the demon, and his ritual only makes things worse."
    severity: core
    paraphrases:
      - "the person hired to help turns out to be on the wrong side"
      - "the ritual meant to save the girl actually serves the villain's plans"
      - "the apparent spiritual ally is, deep down, an accomplice of the monster"
      - "there's a very late betrayal by a character who seemed to be helping"
  - id: wailing_wrong_choice_ending
    canonical: "Jong-goo ignores the mysterious woman's warning to wait until the third rooster's crow and comes home early, where he finds his family murdered by his own possessed daughter."
    severity: major
    paraphrases:
      - "the protagonist makes the wrong decision right before the ending, by trusting the wrong person"
      - "there's a symbolic countdown the protagonist fails to meet"
      - "the ending is a direct family tragedy, not a victory over evil"
      - "the protagonist's faith or doubt determines his own family's fate"
