# Ground truth researched by Claude with cited web sources (not hand-labeled
# by a human). See D7 in docs/DESIGN.md.
title_id: cronocrimenes_2007
labels:
  - id: tc_hector_becomes_his_own_attacker
    canonical: "Hector travels an hour back in time by accident and, to avoid altering what has already happened, ends up becoming the 'bandaged man' who attacks his own past self."
    severity: core
    paraphrases:
      - "the mysterious masked attacker from the start turns out to be the protagonist himself, just from later on"
      - "Hector ends up chasing and attacking himself without meaning to"
      - "there are two, even three, versions of the same man coexisting on the same day"
      - "the villain who's scary at the start isn't a stranger, it's himself at another point in the loop"
      - "every time he tries to fix something, he ends up being the cause of the original problem"
  - id: tc_clara_saved_by_decoy_death
    canonical: "Hector manages to save his wife Clara by substituting her with a stranger (whose hair he cuts and dresses in her coat), who dies in her place."
    severity: major
    paraphrases:
      - "the woman who dies at the end isn't actually who everyone thought"
      - "to protect his wife, he unknowingly sacrifices another person who resembles her"
      - "there's an involuntary identity swap that costs an innocent woman her life"
      - "the protagonist's wife survives, but at a moral cost he has to carry"
  - id: tc_deterministic_closed_loop
    canonical: "The film ends with Hector driving back to the lab to become the next version of himself, closing the loop with no possible escape or reassuring explanation."
    severity: minor
    paraphrases:
      - "there's no clean way out of the time-travel mess, everything closes in on itself"
      - "the ending isn't an explosion or an escape, it's the resigned acceptance of the inevitable"
      - "everything you see at the start of the film was already caused by the protagonist himself"
      - "the cycle repeats indefinitely and no one can fully break it"
sources:
