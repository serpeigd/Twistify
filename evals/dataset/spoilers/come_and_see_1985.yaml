# Ground truth researched by Claude with cited web sources (not hand-labeled
# by a human). See D7 in docs/DESIGN.md.
title_id: come_and_see_1985
labels:
  - id: cs_village_massacre
    canonical: "German soldiers lock the villagers inside a barn-church and set it on fire, killing them all while celebrating."
    severity: core
    paraphrases:
      - "there's a scene where an entire village is burned alive inside a building"
      - "the Nazis turn the massacre of a village into a kind of macabre party"
      - "the film's central horror isn't a battle, it's the collective extermination of locked-up civilians"
      - "the protagonist witnesses the mass killing of women, children, and the elderly in one place"
      - "there's a moment where it becomes clear no one from that village survives"
  - id: cs_family_death
    canonical: "Flyora discovers his entire family (mother and sisters) has been killed while he was away with the partisans."
    severity: major
    paraphrases:
      - "when he gets home, his family is no longer alive"
      - "the boy refuses to accept he's lost his own until it's confirmed to him"
      - "there's a pile of neighbors' corpses behind his house"
      - "his return to his home village ends up being the worst part of the film"
  - id: cs_hitler_baby_ending
    canonical: "In the final scene, Flyora repeatedly shoots a portrait of Hitler while archival newsreel footage of his life plays in reverse, and he stops shooting once it reaches an image of Hitler as a baby."
    severity: major
    paraphrases:
      - "the ending has a sequence of archival footage played backwards"
      - "there's a very symbolic close where the boy stops shooting right when he sees a childhood image"
      - "the final scene connects the historical villain to his own childhood, and it breaks the protagonist"
      - "the ending isn't a battle, it's an almost ritual gesture by the boy in front of an image"
      - "it closes with a visual meditation on the origin of evil, not a plot resolution"
sources:
  - "https://en.wikipedia.org/wiki/Come_and_See"
  - "https://historical-films.fandom.com/wiki/Come_and_See_(1985)"
  - "https://medium.com/its-only-a-movie/come-and-see-1985-beholding-the-face-of-death-079cb8202a21"
