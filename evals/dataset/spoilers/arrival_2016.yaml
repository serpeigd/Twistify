title_id: arrival_2016
labels:
  - id: arr_hannah_is_future
    canonical: "The protagonist's scenes with her daughter Hannah aren't memories of the past — they're visions of a future that hasn't happened yet."
    severity: core
    paraphrases:
      - "what look like flashbacks at the start actually happen after the movie ends"
      - "the timeline of what you're seeing deliberately deceives you about when it occurs"
      - "the protagonist is remembering something she hasn't lived yet"
      - "the alien language gives the protagonist a way to perceive time non-linearly"
  - id: arr_daughter_dies_young
    canonical: "The protagonist knows her future daughter will die young of an illness, and still chooses to have that daughter and live that life with Ian."
    severity: major
    paraphrases:
      - "she chooses a future knowing it includes a devastating loss"
      - "the girl's future father is the fellow scientist she works with throughout the film"
      - "knowing her daughter's tragic fate doesn't stop her from going through with that relationship"
      - "there's a future family tragedy the protagonist already knows about in advance"
sources:
  - "https://www.looper.com/87043/ending-arrival-explained/"
  - "https://www.thereviewgeek.com/arrival-endingexplained/"
