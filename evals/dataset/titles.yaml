# Set de evaluación v1.
#
# Estratificación deliberada. La hipótesis a falsar es:
#   "el baseline sin retrieval parece correcto en títulos populares y
#    se desmorona en cola larga"
# Si no separas los estratos, la media te oculta exactamente el efecto que
# el proyecto existe para demostrar.
#
# Casos de desambiguación incluidos a propósito (dune, oldboy): el resolver
# debe fallar de forma ruidosa, no elegir en silencio.

films:
