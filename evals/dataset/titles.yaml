# Evaluation set v1.
#
# Deliberate stratification. The hypothesis to falsify is:
#   "the baseline with no retrieval looks correct on popular titles and
#    falls apart on long-tail ones"
# If you don't separate the strata, the average hides exactly the effect
# this project exists to demonstrate.
#
# Disambiguation cases included on purpose (dune, oldboy): the resolver
# should fail loudly, not silently pick one.

films:
