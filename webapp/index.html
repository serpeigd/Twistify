<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-Show Reels</title>
<!--
  NOTA DE DISEÑO (por qué esta versión NO muestra un veredicto de verificación):
  se eliminaron a propósito la tarjeta "● sin fugas detectadas" y el panel de
  métricas. Ese "sin fugas" era engañoso presentado como sello verde: el juez
  que lo produce (SubstringJudge) tiene recall medido 0.0 -> no detecta
  paráfrasis, que es como se fuga de verdad. Un badge verde comunica una
  garantía que la medición no respalda. La verificación sigue viva en el
  backend (evals/, /api/stats) para auditarla; no se vende en la ficha.
-->
<style>
  :root {
    --bg:#0a0b0f; --bg-soft:#0f1116; --panel:#14161d; --panel-2:#191c25;
    --border:#242833; --text:#eceef4; --text-dim:#a2aab9; --text-mute:#6a7284;

    /* ZONA SEGURA (pre-show, spoiler-free) — verde/teal */
    --safe:#52c99a; --safe-soft:#84e0bd; --safe-bg:#0c1512; --safe-panel:#0f1b17;
    --safe-brd:#1f4438; --safe-glow:rgba(82,201,154,.14);
    /* ZONA PROFUNDA (deep dive, spoilers) — ámbar/óxido */
    --deep:#e0a35c; --deep-soft:#f0c58e; --deep-bg:#16100a; --deep-panel:#1d150c;
    --deep-brd:#4a3418; --deep-red:#e0705f; --deep-glow:rgba(224,163,92,.13);
    --violet:#b79bf0;
    --radius:14px;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#242833;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#333949}

  /* header */
  header{display:flex;align-items:center;gap:14px;padding:15px 26px;
    border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--bg-soft),rgba(15,17,22,0));
    position:sticky;top:0;z-index:30;backdrop-filter:blur(8px)}
  .brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em}
  .brand .dot{color:var(--safe)}
  .tag{margin-left:4px;font-size:12.5px;color:var(--text-mute);
    border-left:1px solid var(--border);padding-left:14px}

  /* layout */
  .layout{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 59px)}
  aside{border-right:1px solid var(--border);background:var(--bg-soft);
    display:flex;flex-direction:column;min-height:0}
  .search-wrap{padding:14px;border-bottom:1px solid var(--border)}
  .search-wrap input{width:100%;padding:10px 13px;background:var(--panel);
    border:1px solid var(--border);border-radius:10px;color:var(--text);
    font-size:13.5px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
  .search-wrap input:focus{outline:none;border-color:var(--safe);box-shadow:0 0 0 3px var(--safe-glow)}
  .filters{display:flex;gap:6px;margin-top:10px}
  .filters button{flex:1;padding:6px 8px;font-size:11.5px;cursor:pointer;
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    color:var(--text-dim);font-family:inherit;transition:all .14s}
  .filters button:hover{color:var(--text);border-color:#333949}
  .filters button.on{background:var(--safe);border-color:var(--safe);color:#06120d;font-weight:600}
  .catalogue{overflow-y:auto;padding:10px;flex:1;min-height:0}
  .group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--text-mute);margin:16px 10px 8px;font-weight:700}
  .film-btn{display:block;width:100%;text-align:left;cursor:pointer;background:none;
    border:1px solid transparent;border-radius:10px;padding:11px 13px;margin-bottom:3px;
    color:var(--text);font-family:inherit;font-size:14px;line-height:1.35;position:relative;
    transition:background .15s,border-color .15s,transform .1s}
  .film-btn:hover{background:var(--panel);transform:translateX(2px)}
  .film-btn.active{background:var(--panel-2);border-color:var(--safe-brd)}
  .film-btn.active::before{content:"";position:absolute;left:0;top:12px;bottom:12px;
    width:3px;background:var(--safe);border-radius:3px}
  .film-btn .t{font-weight:550}
  .film-btn .meta{display:flex;align-items:center;gap:8px;margin-top:5px}
  .film-btn .yr{font-size:11.5px;color:var(--text-mute);font-variant-numeric:tabular-nums}
  .bar{flex:1;height:3px;background:#1e222c;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--safe);border-radius:3px;transition:width .4s}
  .tag-uncurated{font-size:10px;color:var(--text-mute);border:1px solid var(--border);
    padding:1px 6px;border-radius:5px}

  /* main */
  main{overflow-y:auto;min-height:0;scroll-behavior:smooth}
  .wrap{max-width:820px;margin:0 auto;padding:40px 44px 120px}
  .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;color:var(--text-mute);gap:14px;text-align:center;padding:40px}
  .placeholder .big{font-size:46px;opacity:.3}

  /* hero */
  .hero{margin-bottom:14px}
  .hero .kicker{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--safe);font-weight:700;margin-bottom:10px}
  .hero h2{margin:0;font-size:46px;letter-spacing:-.03em;line-height:1.03;font-weight:760}
  .hero .note{margin-top:12px;font-size:13.5px;color:var(--text-dim);font-style:italic;
    border-left:2px solid var(--border);padding-left:12px}

  /* ZONA (marco de fase) */
  .zone{border-radius:22px;padding:4px;margin:26px 0;position:relative}
  .zone-safe{background:linear-gradient(180deg,var(--safe-glow),rgba(82,201,154,0) 260px),var(--safe-bg);
    border:1px solid var(--safe-brd);box-shadow:0 0 0 1px rgba(82,201,154,.04),0 30px 70px -46px rgba(82,201,154,.55)}
  .zone-deep{background:linear-gradient(180deg,var(--deep-glow),rgba(224,163,92,0) 260px),var(--deep-bg);
    border:1px solid var(--deep-brd);box-shadow:0 0 0 1px rgba(224,163,92,.04),0 30px 70px -46px rgba(224,163,92,.5)}
  .zone-frame{display:flex;align-items:center;gap:12px;padding:18px 22px 6px;flex-wrap:wrap}
  .zone-badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:999px}
  .zone-safe .zone-badge{color:var(--safe);background:rgba(82,201,154,.1);border:1px solid var(--safe-brd)}
  .zone-deep .zone-badge{color:var(--deep);background:rgba(224,163,92,.1);border:1px solid var(--deep-brd)}
  .zone-badge .pulse{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 2.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .zone-sub{font-size:12.5px;color:var(--text-mute)}
  .zone-body{padding:8px 10px 14px}

  /* card */
  .card{border-radius:var(--radius);padding:22px 24px;margin:10px 0;transition:transform .16s,box-shadow .16s}
  .zone-safe .card{background:var(--safe-panel);border:1px solid rgba(31,68,56,.6)}
  .zone-deep .card{background:var(--deep-panel);border:1px solid rgba(74,52,24,.55)}
  .zone-safe .card:hover{transform:translateY(-2px);box-shadow:0 16px 44px -30px rgba(82,201,154,.55)}
  .zone-deep .card:hover{transform:translateY(-2px);box-shadow:0 16px 44px -30px rgba(224,163,92,.55)}
  .card>h3{margin:0;font-size:19px;font-weight:680;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
  .card>h3 .ico{font-size:18px;line-height:1;filter:saturate(.85)}
  .card>.lede{margin:5px 0 16px;font-size:12.5px;color:var(--text-mute);padding-left:28px}
  .card>.body-first{margin-top:16px}
  .zone-safe .card>h3{color:var(--safe-soft)}
  .zone-deep .card>h3{color:var(--deep-soft)}

  /* story */
  .story{font-family:var(--serif);font-size:18.5px;line-height:1.75;color:#e4e7ee;margin-top:16px}
  .story p{margin:0 0 1.05em}
  .story p:last-child{margin-bottom:0}
  .story p:first-child::first-letter{float:left;font-family:var(--serif);font-size:3.6em;
    line-height:.76;padding:6px 12px 0 0;color:var(--safe);font-weight:600}

  /* fact bullets (antes de verla / datos curiosos) */
  .facts{margin:16px 0 0;padding:0;list-style:none}
  .facts li{padding:15px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .facts li:last-child{border-bottom:none;padding-bottom:0}
  .facts li:first-child{padding-top:0}
  .fact-lead{display:block;font-weight:680;font-size:15px;margin-bottom:4px}
  .zone-safe .fact-lead{color:var(--safe-soft)}
  .zone-deep .fact-lead{color:var(--deep-soft)}
  .fact-txt{display:block;font-size:14.5px;color:var(--text-dim);line-height:1.6}

  /* tono */
  .tone-lead{margin:16px 0 0;font-size:16.5px;line-height:1.6;color:#e9ecf3;font-weight:450}
  .tone-lead b{color:var(--safe-soft);font-weight:650}

  /* author voice — pull quotes */
  .voices{margin-top:16px;display:flex;flex-direction:column;gap:14px}
  .voice{position:relative;padding:2px 0 2px 26px}
  .voice::before{content:"“";position:absolute;left:-2px;top:-8px;font-family:var(--serif);
    font-size:40px;line-height:1;color:var(--safe);opacity:.5}
  .voice .q{font-family:var(--serif);font-size:16px;line-height:1.62;color:#e6e9f0}
  .voice .src{margin-top:8px}

  /* temperature block */
  .temp-hero{margin-top:16px;font-family:var(--serif);font-size:22px;line-height:1.42;
    font-style:italic;color:#f1f3f8;text-align:center;padding:14px 8px 20px;
    border-bottom:1px solid rgba(31,68,56,.5)}
  .why-head{margin:18px 0 8px;font-size:11px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--safe)}
  .why{font-size:14.5px;color:var(--text-dim)}

  /* sourced list */
  ul.clean{list-style:none;margin:16px 0 0;padding:0}
  ul.clean li{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  ul.clean li:last-child{border-bottom:none;padding-bottom:0}
  ul.clean li:first-child{padding-top:0}
  .src,.nosrc,.interp{display:inline-flex;align-items:center;gap:4px;margin-top:8px;
    font-size:11px;padding:3px 9px;border-radius:6px;font-family:var(--mono);text-decoration:none}
  .src{color:var(--text-mute);background:rgba(255,255,255,.04)}
  .src:hover{color:var(--deep-soft);background:rgba(224,163,92,.12)}
  .nosrc{color:var(--deep);background:rgba(224,163,92,.09)}
  .interp{color:var(--violet);background:rgba(183,155,240,.1)}

  /* chips nav (interactivo, dentro de la zona deep) */
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:2px 12px 10px}
  .chip{cursor:pointer;font-size:12.5px;font-family:inherit;font-weight:550;
    padding:7px 13px;border-radius:999px;color:var(--deep-soft);
    background:rgba(224,163,92,.08);border:1px solid var(--deep-brd);
    transition:background .14s,transform .1s;white-space:nowrap}
  .chip:hover{background:rgba(224,163,92,.18);transform:translateY(-1px)}

  /* unlock */
  .unlock{text-align:center;padding:42px 28px}
  .unlock .ic{font-size:32px;margin-bottom:12px}
  .unlock h4{margin:0 0 8px;font-size:22px;font-weight:720;color:var(--deep-soft)}
  .unlock p{margin:0 auto 22px;max-width:440px;font-size:14px;color:var(--text-dim)}
  .unlock .warn{color:var(--deep-red);font-weight:700;letter-spacing:.03em}
  .unlock-btn{display:inline-flex;align-items:center;gap:10px;cursor:pointer;padding:14px 28px;
    font-size:15px;font-weight:680;font-family:inherit;color:#140d04;
    background:linear-gradient(180deg,var(--deep-soft),var(--deep));border:none;border-radius:12px;
    transition:transform .14s,box-shadow .2s;box-shadow:0 12px 34px -12px rgba(224,163,92,.6)}
  .unlock-btn:hover{transform:translateY(-2px);box-shadow:0 18px 46px -14px rgba(224,163,92,.78)}
  .unlock-btn:active{transform:translateY(0)}
  .unlock-btn .arrow{transition:transform .18s}
  .unlock-btn:hover .arrow{transform:translateX(4px)}
  .relock{display:inline-flex;align-items:center;gap:6px;margin-left:auto;cursor:pointer;
    background:none;border:1px solid var(--deep-brd);color:var(--deep);border-radius:8px;
    padding:6px 12px;font-size:12px;font-family:inherit;transition:background .14s}
  .relock:hover{background:rgba(224,163,92,.1)}

  /* reveal anim */
  .reveal{animation:reveal .55s cubic-bezier(.16,.8,.3,1) both}
  @keyframes reveal{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .stagger>*{animation:reveal .5s cubic-bezier(.16,.8,.3,1) both}
  .stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.06s}
  .stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.14s}
  .stagger>*:nth-child(5){animation-delay:.18s}.stagger>*:nth-child(6){animation-delay:.22s}
  .stagger>*:nth-child(n+7){animation-delay:.26s}

  /* scenes */
  .scene-name{font-weight:650;margin-bottom:5px;font-size:15.5px;color:var(--deep-soft)}
  .scene-txt{color:var(--text-dim);font-size:14px}

  /* scores */
  .scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
  .score{background:rgba(255,255,255,.03);border:1px solid rgba(74,52,24,.5);border-radius:11px;padding:14px 16px}
  .score .s{font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
  .score .v{font-size:14px;font-weight:600;line-height:1.4}
  .score a{color:var(--deep);text-decoration:none;font-size:11px;font-family:var(--mono)}
  .awards{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .award{font-size:11.5px;background:rgba(255,255,255,.03);border:1px solid rgba(74,52,24,.5);
    padding:5px 10px;border-radius:7px;color:var(--text-dim)}
  .crit-sum{margin-top:16px;font-size:14px;color:var(--text-dim);line-height:1.6}

  .sw-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
  .sw h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.07em}
  .sw.good h4{color:var(--safe)}.sw.bad h4{color:var(--deep-red)}
  .sw ul{margin:0;padding:0;list-style:none}
  .sw li{font-size:14px;color:var(--text-dim);padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .sw li:last-child{border:none}

  .verdict-box{font-family:var(--serif);font-size:21px;line-height:1.5;font-style:italic;
    color:#f0f2f7;border-left:3px solid var(--deep);padding-left:20px;margin-top:16px}
  .useless{background:linear-gradient(135deg,rgba(183,155,240,.1),rgba(224,163,92,.04))!important;
    border-color:rgba(183,155,240,.28)!important}
  .useless>h3{color:var(--violet)!important}
  .useless .body-txt{margin-top:16px;font-size:15px;color:var(--text-dim);line-height:1.65}

  .q-list li{font-size:16px;padding:15px 0;color:var(--text);line-height:1.5}
  .lede-inline{font-size:12.5px;color:var(--text-mute);margin:16px 0 4px}
  .debate{margin:12px 0 0;padding:0;list-style:none}
  .debate-card{font-family:var(--serif);font-size:16px;font-style:italic;color:var(--text-dim);
    padding:16px 18px;background:rgba(255,255,255,.03);border:1px solid rgba(74,52,24,.5);
    border-radius:11px;margin-bottom:10px;cursor:pointer;position:relative;
    transition:background .14s,transform .1s,border-color .14s}
  .debate-card:hover{background:rgba(224,163,92,.08);border-color:var(--deep-brd);transform:translateY(-1px)}
  .reply-hint{display:block;margin-top:8px;font-family:var(--sans);font-style:normal;
    font-size:11.5px;font-weight:650;letter-spacing:.03em;color:var(--deep)}

  /* CTA cierre */
  .cta-shell{margin-top:14px;text-align:center}
  .cta-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--deep);margin-bottom:10px}
  .cta-box{padding:26px 28px;font-size:18px;line-height:1.5;font-weight:500;
    font-family:var(--serif);font-style:italic;color:var(--deep-soft);
    background:linear-gradient(135deg,rgba(224,163,92,.12),rgba(224,163,92,.02));
    border:1px solid var(--deep-brd);border-radius:var(--radius)}

  /* comments */
  .cm-wrap{margin-top:30px}
  .cm-wrap>h3{font-size:19px;font-weight:680;margin:0 0 16px;display:flex;align-items:center;gap:10px}
  .cm-form{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
  .cm-form input,.cm-form textarea{background:var(--panel-2);border:1px solid var(--border);
    border-radius:10px;padding:11px 14px;color:var(--text);font-family:inherit;font-size:14px;
    resize:vertical;transition:border-color .15s}
  .cm-form input:focus,.cm-form textarea:focus{outline:none;border-color:var(--safe)}
  .cm-row{display:flex;gap:10px;align-items:center}
  .cm-row input[type=text]{flex:1}
  .cm-check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-dim);white-space:nowrap}
  .cm-form button{align-self:flex-start;padding:10px 22px;background:var(--safe);border:none;
    color:#06120d;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:650;
    transition:transform .12s,filter .12s}
  .cm-form button:hover{transform:translateY(-1px);filter:brightness(1.08)}
  .cm{padding:15px 0;border-bottom:1px solid var(--border)}
  .cm:last-child{border-bottom:none}
  .cm .head{display:flex;gap:10px;align-items:center;margin-bottom:6px}
  .cm .who{font-weight:650;font-size:13.5px}
  .cm .when{font-size:11px;color:var(--text-mute);font-variant-numeric:tabular-nums}
  .cm .sp{font-size:10px;background:rgba(224,112,95,.14);color:var(--deep-red);
    padding:2px 7px;border-radius:5px;font-weight:600}
  .cm .body{font-size:14px;color:var(--text-dim)}
  .cm .body.hidden{filter:blur(5px);cursor:pointer;user-select:none}
  .empty-note{color:var(--text-mute);font-size:13.5px;font-style:italic}

  .sources-card h3{font-size:13px!important;color:var(--text-mute)!important;
    text-transform:uppercase;letter-spacing:.06em}
  .src-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}

  @media (max-width:760px){.layout{grid-template-columns:1fr}aside{display:none}
    .wrap{padding:24px 20px 80px}.hero h2{font-size:34px}.sw-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="brand"><h1><span class="dot">●</span> Pre-Show Reels</h1></div>
  <span class="tag">Antes de verla, sin spoilers. Después, sin filtros.</span>
</header>

<div class="layout">
  <aside>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Buscar película…" autocomplete="off">
      <div class="filters">
        <button data-f="all" class="on">Todas</button>
        <button data-f="mainstream">Populares</button>
        <button data-f="longtail">Cola larga</button>
      </div>
    </div>
    <div class="catalogue" id="catalogue"></div>
  </aside>

  <main>
    <div class="placeholder" id="main">
      <div class="big">🎞</div>
      <div>Elige una película para empezar.</div>
    </div>
  </main>
</div>

<script>
let CATALOGUE = [], CURRENT = null, FILTER = 'all', QUERY = '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const host = u => { try { return new URL(u).hostname.replace('www.', ''); } catch { return u; } };

async function loadCatalogue() {
  CATALOGUE = await (await fetch('/api/catalogue')).json();
  renderCatalogue();
}
function renderCatalogue() {
  const q = QUERY.toLowerCase();
  const items = CATALOGUE.filter(f =>
    (FILTER === 'all' || f.stratum === FILTER) &&
    (!q || f.title.toLowerCase().includes(q) || String(f.year).includes(q)));
  const groups = { mainstream: [], longtail: [] };
  items.forEach(f => groups[f.stratum].push(f));
  const names = { mainstream: 'Populares', longtail: 'Cola larga' };
  let html = '';
  for (const [k, list] of Object.entries(groups)) {
    if (!list.length) continue;
    html += `<div class="group-label">${names[k]} · ${list.length}</div>`;
    list.forEach(f => {
      html += `<button class="film-btn ${CURRENT === f.title_id ? 'active' : ''}" data-id="${f.title_id}">
        <div class="t">${esc(f.title)}</div>
        <div class="meta"><span class="yr">${f.year}</span>
        ${f.curated ? `<span class="bar"><i style="width:${f.completeness}%"></i></span>`
                    : `<span class="tag-uncurated">sin curar</span>`}</div></button>`;
    });
  }
  const el = document.getElementById('catalogue');
  el.innerHTML = html || '<div class="group-label">Sin resultados</div>';
  el.querySelectorAll('.film-btn').forEach(b =>
    b.onclick = () => { CURRENT = b.dataset.id; renderCatalogue();
      document.querySelector('main').scrollTop = 0; loadFilm(); });
}
document.getElementById('search').oninput = e => { QUERY = e.target.value; renderCatalogue(); };
document.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.filters button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); FILTER = b.dataset.f; renderCatalogue();
});

async function loadFilm() {
  const main = document.getElementById('main');
  main.className = ''; main.innerHTML = '<div class="wrap"><p class="empty-note">Cargando…</p></div>';
  const d = await (await fetch(`/api/film/${CURRENT}?seen=false`)).json();
  renderFilm(d);
  loadComments();
}

function sourceTag(o) {
  if (o.kind === 'interpretation') return `<span class="interp">◇ interpretación</span>`;
  if (o.source_id) return `<a class="src" href="${esc(o.source_id)}" target="_blank" rel="noopener">↗ ${esc(host(o.source_id))}</a>`;
  return `<span class="nosrc">⚠ sin fuente</span>`;
}
const sourcedList = items => `<ul class="clean">${items.map(o => `<li>${esc(o.text)}${sourceTag(o)}</li>`).join('')}</ul>`;
const factList = items => `<ul class="facts">${items.map(o =>
  `<li><span class="fact-lead">${esc(o.lead)}</span><span class="fact-txt">${esc(o.text)}</span>${sourceTag(o)}</li>`).join('')}</ul>`;

function focusComment(spoiler) {
  const box = document.getElementById('cmText'), chk = document.getElementById('cmSpoiler');
  const main = document.querySelector('main');
  if (!box || !main) return;
  if (chk && spoiler) chk.checked = true;
  const top = main.scrollTop + box.getBoundingClientRect().top - main.getBoundingClientRect().top - 90;
  main.scrollTo({ top, behavior: 'smooth' });
  setTimeout(() => box.focus(), 420);
}

/* bloque de bloqueo (texto exacto pedido) */
const LOCK_HTML = `<div class="unlock"><div class="ic">🗝️</div>
  <h4>El mapa de easter eggs</h4>
  <p>Metáforas, easter eggs, datos de rodaje, análisis de escenas y crítica.
  <span class="warn">TODO ESTO CONTIENE SPOILERS.</span></p>
  <button class="unlock-btn" id="unlockBtn">Ya la he visto — desbloquear <span class="arrow">▸</span></button></div>`;

function renderFilm(d) {
  const c = d.case, main = document.getElementById('main');

  if (!d.curated) {
    main.innerHTML = `<div class="wrap">
      <div class="hero"><div class="kicker">${c.stratum === 'longtail' ? 'Cola larga' : 'Popular'}</div>
      <h2>${esc(c.title)} · ${c.year}</h2></div>
      <div class="zone zone-deep"><div class="unlock"><div class="ic">📭</div>
        <h4>Ficha sin curar todavía</h4>
        <p>Está en el catálogo pero aún no tiene contenido investigado. El repertorio se
        rellena con investigación citada, no generando texto desde la memoria de un modelo.</p></div></div></div>`;
    return;
  }

  const ct = d.content;
  document.title = `${c.title} — Pre-Show Reels`;
  const storyHtml = ct.story ? ct.story.split('\n\n').map(p => `<p>${esc(p)}</p>`).join('') : '';

  let html = `<div class="wrap">
    <div class="hero">
      <div class="kicker">${c.stratum === 'longtail' ? 'Cola larga' : 'Popular'} · ${c.year}</div>
      <h2>${esc(c.title)}</h2>
      ${c.notes ? `<div class="note">${esc(c.notes)}</div>` : ''}
    </div>

    <section class="zone zone-safe">
      <div class="zone-frame">
        <span class="zone-badge"><span class="pulse"></span> Zona sin spoilers</span>
        <span class="zone-sub">Léelo antes de verla · no revela nada de la trama</span>
      </div>
      <div class="zone-body stagger">`;

  if (ct.story) html += `<div class="card">
      <h3><span class="ico">🎬</span> Cómo se vive, en una historia</h3>
      <div class="lede">El tráiler, pero contado. Nada de spoilers.</div>
      <div class="story">${storyHtml}</div></div>`;

  if (ct.before_watching && ct.before_watching.length)
    html += `<div class="card">
      <h3><span class="ico">🧠</span> Antes de verla</h3>
      <div class="lede">Lo que conviene saber para entrar. Nada de la trama.</div>
      ${factList(ct.before_watching)}</div>`;

  if (ct.author_voice && ct.author_voice.length)
    html += `<div class="card">
      <h3><span class="ico">🎥</span> Qué buscaba quien la hizo</h3>
      <div class="lede">Su intención, en palabras del propio director.</div>
      <div class="voices">${ct.author_voice.map(o =>
        `<div class="voice"><div class="q">${esc(o.text)}</div>${sourceTag(o)}</div>`).join('')}</div></div>`;

  if (ct.emotional_temperature || ct.why_now)
    html += `<div class="card">
      <h3><span class="ico">🎭</span> El tono que te espera</h3>
      ${ct.emotional_temperature ? `<p class="tone-lead">${esc(ct.emotional_temperature)}</p>` : ''}
      ${ct.why_now ? `<div class="why-head">Por qué verla ahora</div><div class="why">${esc(ct.why_now)}</div>` : ''}</div>`;

  html += `</div></section>

    <section class="zone zone-deep" id="deepZone">${LOCK_HTML}</section>

    <div id="phase4"></div>

    <div class="cm-wrap"><h3><span class="ico">💬</span> Comentarios</h3>
      <div class="cm-form">
        <div class="cm-row">
          <input type="text" id="cmAuthor" placeholder="Tu nombre (opcional)" maxlength="40">
          <label class="cm-check"><input type="checkbox" id="cmSpoiler"> contiene spoilers</label>
        </div>
        <textarea id="cmText" rows="3" placeholder="¿Qué te ha parecido?"></textarea>
        <button id="cmSend">Publicar comentario</button>
      </div>
      <div id="cmList"></div></div>
  </div>`;

  main.innerHTML = html;
  document.getElementById('unlockBtn').onclick = unlockDeep;
  document.getElementById('cmSend').onclick = postComment;
  renderPhase4(ct);
}

function renderPhase4(ct) {
  let h = '';
  if ((ct.questions || []).length)
    h += `<div class="zone zone-safe" style="margin-top:26px"><div class="zone-frame">
      <span class="zone-badge"><span class="pulse"></span> Para pensar</span>
      <span class="zone-sub">Sin spoilers · deja la conversación abierta</span></div>
      <div class="zone-body"><div class="card"><h3><span class="ico">❓</span> Preguntas que deja abiertas</h3>
      <ul class="clean q-list">${ct.questions.map(q => `<li>${esc(q)}</li>`).join('')}</ul></div></div></div>`;
  document.getElementById('phase4').innerHTML = h;
}

/* desbloqueo INLINE con navegación por chips */
async function unlockDeep() {
  const btn = document.getElementById('unlockBtn');
  btn.disabled = true; btn.innerHTML = 'Desbloqueando…';
  const d = await (await fetch(`/api/film/${CURRENT}?seen=true`)).json();
  const ct = d.content;

  const sections = [];
  const push = (id, ico, title, inner, extra = '') =>
    sections.push({ id, ico, title, html:
      `<div class="card ${extra}" id="${id}"><h3><span class="ico">${ico}</span> ${title}</h3>${inner}</div>` });

  if ((ct.metaphors || []).length)
    push('sec-meta', '🪞', 'Lo que en realidad te cuenta', sourcedList(ct.metaphors));
  if ((ct.intertextual_refs || []).length)
    push('sec-ref', '🔗', 'Referencias y guiños', sourcedList(ct.intertextual_refs));
  if ((ct.production_trivia || []).length)
    push('sec-rod', '🎬', 'El rodaje por dentro', sourcedList(ct.production_trivia));
  if ((ct.scene_analysis || []).length)
    push('sec-esc', '🔍', 'Escenas clave, explicadas',
      `<ul class="clean">${ct.scene_analysis.map(s =>
        `<li><div class="scene-name">${esc(s.scene)}</div><div class="scene-txt">${esc(s.text)}</div>${sourceTag(s)}</li>`).join('')}</ul>`);

  const cc = ct.critical_consensus || {};
  if (cc.summary || (cc.scores || []).length || (cc.awards || []).length)
    push('sec-cri', '⭐', 'Qué dijo la crítica',
      `${cc.summary ? `<div class="crit-sum">${esc(cc.summary)}</div>` : ''}
       ${(cc.scores || []).length
          ? `<div class="scores">${cc.scores.map(s => `<div class="score"><div class="s">${esc(s.source)}</div>
             <div class="v">${esc(s.value)}</div>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">↗ verificar</a>` : ''}</div>`).join('')}</div>`
          : `<div class="nosrc" style="margin-top:16px">⚠ sin puntuaciones verificadas — no se inventan</div>`}
       ${(cc.awards || []).length ? `<div class="awards">${cc.awards.map(a => `<span class="award">${esc(a)}</span>`).join('')}</div>` : ''}`);

  if ((ct.strengths || []).length || (ct.weaknesses || []).length)
    push('sec-bal', '⚖️', 'Lo mejor y lo peor', `<div class="sw-grid">
      <div class="sw good"><h4>▲ Lo que borda</h4><ul>${(ct.strengths || []).map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>
      <div class="sw bad"><h4>▼ Lo discutible</h4><ul>${(ct.weaknesses || []).map(s => `<li>${esc(s)}</li>`).join('')}</ul></div></div>`);

  if ((ct.fun_facts || []).length)
    push('sec-dato', '🎲', 'Datos curiosos de la película', factList(ct.fun_facts));
  if (ct.verdict)
    push('sec-ver', '🏛️', 'Su lugar en la historia', `<div class="verdict-box">${esc(ct.verdict)}</div>`);
  if ((ct.debate_prompts || []).length)
    push('sec-deb', '🔥', '¿Y tú de qué lado estás?',
      `<div class="lede-inline">Pulsa una afirmación y suéltalo en los comentarios.</div>
       <ul class="debate">${ct.debate_prompts.map(q =>
         `<li class="debate-card" tabindex="0">${esc(q)}<span class="reply-hint">Responder ▾</span></li>`).join('')}</ul>`);

  const chips = `<div class="chips">${sections.map(s =>
    `<span class="chip" data-go="${s.id}">${s.ico} ${s.title}</span>`).join('')}</div>`;

  let inner = `<div class="zone-frame">
      <span class="zone-badge"><span class="pulse"></span> Ya has visto la obra</span>
      <span class="zone-sub">Análisis completo, con spoilers</span>
      <button class="relock" id="relockBtn">🔒 ocultar</button></div>
    ${chips}
    <div class="zone-body stagger">${sections.map(s => s.html).join('')}</div>`;

  if (ct.cta)
    inner += `<div class="zone-body" style="padding-top:0"><div class="cta-shell">
      <div class="cta-label">Antes de irte</div><div class="cta-box">${esc(ct.cta)}</div></div></div>`;
  if ((ct.sources || []).length)
    inner += `<div class="zone-body" style="padding-top:0"><div class="card sources-card">
      <h3>Fuentes consultadas · ${ct.sources.length}</h3>
      <div class="src-list">${ct.sources.map(s => `<a class="src" href="${esc(s)}" target="_blank" rel="noopener">↗ ${esc(host(s))}</a>`).join('')}</div></div></div>`;

  const zone = document.getElementById('deepZone');
  zone.innerHTML = inner;
  zone.classList.add('reveal');
  document.getElementById('relockBtn').onclick = relockDeep;
  zone.querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
    const t = document.getElementById(ch.dataset.go);
    const main = document.querySelector('main');
    if (t && main) {
      const top = main.scrollTop + t.getBoundingClientRect().top - main.getBoundingClientRect().top - 16;
      main.scrollTo({ top, behavior: 'smooth' });
    }
  });
  zone.querySelectorAll('.debate-card').forEach(el => el.onclick = () => focusComment(true));
}

function relockDeep() {
  const zone = document.getElementById('deepZone');
  zone.classList.remove('reveal');
  zone.innerHTML = LOCK_HTML;
  document.getElementById('unlockBtn').onclick = unlockDeep;
  zone.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function loadComments() {
  const list = document.getElementById('cmList');
  if (!list) return;
  const cs = await (await fetch(`/api/film/${CURRENT}/comments`)).json();
  if (!cs.length) { list.innerHTML = '<div class="empty-note">Sé el primero en comentar.</div>'; return; }
  list.innerHTML = cs.slice().reverse().map(c => `
    <div class="cm"><div class="head"><span class="who">${esc(c.author)}</span>
      <span class="when">${esc((c.at || '').replace('T', ' ').replace('+00:00', ''))}</span>
      ${c.spoilers ? '<span class="sp">SPOILERS</span>' : ''}</div>
    <div class="body ${c.spoilers ? 'hidden' : ''}" onclick="this.classList.remove('hidden')">${esc(c.text)}</div></div>`).join('');
}
async function postComment() {
  const text = document.getElementById('cmText').value.trim();
  if (!text) return;
  await fetch(`/api/film/${CURRENT}/comments`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, author: document.getElementById('cmAuthor').value.trim() || 'anónimo',
      spoilers: document.getElementById('cmSpoiler').checked }) });
  document.getElementById('cmText').value = '';
  document.getElementById('cmSpoiler').checked = false;
  loadComments();
}

loadCatalogue();
</script>
</body>
</html>
